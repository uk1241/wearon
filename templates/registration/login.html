{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — TextileFlow</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="brand-mark">W</div>
      <h1>TextileFlow</h1>
      <p class="sub">Sign in to Workshop MS</p>
      {% if form.errors %}
        <div class="error-list">Invalid username or password. Please try again.</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="field">
          <label for="id_username">Username</label>
          <input type="text" name="username" id="id_username" autofocus required>
        </div>
        <div class="field">
          <label for="id_password">Password</label>
          <input type="password" name="password" id="id_password" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>
    </div>
  </div>
</body>
</html>

{% extends "base.html" %}
{% block title %}Add Customer — TextileFlow{% endblock %}
{% block content %}
<h1 class="page-title">Add Customer</h1>
<div class="card form-card" style="max-width:760px;">
  <form method="post">
    {% csrf_token %}
    <div class="field-grid">
      <div class="field">
        <label for="id_name">Name</label>
        {{ form.name }}
      </div>
      <div class="field">
        <label for="id_phone">Mobile</label>
        {{ form.phone }}
      </div>
      <div class="field">
        <label for="id_email">Email</label>
        {{ form.email }}
      </div>
      <div class="field" style="grid-column: span 2;">
        <label for="id_address">Address</label>
        {{ form.address }}
      </div>
    </div>
    <div class="form-actions" style="margin-top:12px;">
      <input type="hidden" name="next" value="{{ next }}">
      <a href="{% if next %}{{ next }}{% else %}{% url 'customer-list' %}{% endif %}" class="btn btn-outline">Cancel</a>
      <button class="btn btn-primary" type="submit">Save Customer</button>
    </div>
  </form>
</div>
{% endblock %}
